    <rect x="476" y="108" width="248" height="146" rx="24" fill="url(#chip)" stroke="#F8FAFC" stroke-opacity="0.64" stroke-width="2"/>
    <rect x="506" y="136" width="188" height="90" rx="16" fill="#082F49" fill-opacity="0.8" stroke="#FFFFFF" stroke-opacity="0.2"/>
    <text x="600" y="170" text-anchor="middle" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="36" font-weight="800" letter-spacing="1">CoreWeaver</text>
    <text x="600" y="200" text-anchor="middle" fill="#BAE6FD" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2">HARNESS-FIRST SILICON AI</text>
    <text x="600" y="223" text-anchor="middle" fill="#D1FAE5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">typed contracts, replay, gates, handoff</text>

    <g stroke="#082F49" stroke-width="6" stroke-linecap="round">
      <path d="M476 131H444"/>
      <path d="M476 157H444"/>
      <path d="M476 183H444"/>
      <path d="M476 209H444"/>
      <path d="M724 131H756"/>
      <path d="M724 157H756"/>
      <path d="M724 183H756"/>
      <path d="M724 209H756"/>
      <path d="M527 108V80"/>
      <path d="M570 108V80"/>
      <path d="M613 108V80"/>
      <path d="M656 108V80"/>
      <path d="M527 254V282"/>
      <path d="M570 254V282"/>
      <path d="M613 254V282"/>
      <path d="M656 254V282"/>
