      <text x="22" y="31" fill="#F8FAFC" font-size="15" font-weight="800">Architecture Contract</text>
      <text x="22" y="55" fill="#BAE6FD" font-size="12" font-weight="600">typed, reviewable, bounded</text>
    </g>
    <g transform="translate(900 86)">
      <rect width="224" height="74" rx="18" fill="url(#panel)" stroke="#FFFFFF" stroke-opacity="0.24"/>
      <text x="22" y="31" fill="#F8FAFC" font-size="15" font-weight="800">Trace + Replay</text>
      <text x="22" y="55" fill="#BAE6FD" font-size="12" font-weight="600">debuggable event history</text>
    </g>
    <g transform="translate(900 182)">
