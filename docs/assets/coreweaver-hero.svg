    <path d="M382 147L390 155L382 163" stroke="#BAE6FD" stroke-width="3"/>
    <path d="M302 251H390" stroke="#A7F3D0" stroke-width="3"/>
    <path d="M382 243L390 251L382 259" stroke="#A7F3D0" stroke-width="3"/>
    <path d="M810 136H890" stroke="#BAE6FD" stroke-width="3"/>
    <path d="M882 128L890 136L882 144" stroke="#BAE6FD" stroke-width="3"/>
    <path d="M810 220H890" stroke="#A7F3D0" stroke-width="3"/>
