  </g>

  <text x="600" y="329" text-anchor="middle" fill="#E0F2FE" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.8">REQUIREMENTS TO ARCHITECTURE CONTRACTS THROUGH AGENT-FIRST HARNESSING</text>
