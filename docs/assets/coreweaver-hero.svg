<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">CoreWeaver hero banner</title>
  <desc id="desc">A silicon architecture harness banner showing requirements flowing through Agent1, trace, signoff, and Agent2 handoff gates.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#082F49"/>
      <stop offset="0.42" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="chip" x1="420" y1="88" x2="780" y2="288" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E0F2FE"/>
      <stop offset="0.52" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.32"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <path d="M45 286C177 235 260 300 407 250C542 204 633 107 782 135C922 161 1019 268 1156 218" stroke="#A7F3D0" stroke-opacity="0.28" stroke-width="3"/>
  <path d="M80 74C220 124 300 54 430 96C568 141 634 241 792 222C916 207 1019 126 1128 152" stroke="#BAE6FD" stroke-opacity="0.28" stroke-width="3"/>

  <g opacity="0.48">
    <circle cx="112" cy="86" r="4" fill="#E0F2FE"/>
    <circle cx="210" cy="264" r="4" fill="#A7F3D0"/>
    <circle cx="982" cy="82" r="4" fill="#E0F2FE"/>
    <circle cx="1086" cy="282" r="4" fill="#A7F3D0"/>
    <path d="M112 86H236V132H358" stroke="#E0F2FE" stroke-opacity="0.32" stroke-width="2"/>
    <path d="M842 132H982V82" stroke="#E0F2FE" stroke-opacity="0.32" stroke-width="2"/>
    <path d="M842 230H990V282H1086" stroke="#A7F3D0" stroke-opacity="0.32" stroke-width="2"/>
    <path d="M210 264H358V230" stroke="#A7F3D0" stroke-opacity="0.32" stroke-width="2"/>
  </g>

