name: Feature request
description: Propose a scoped CoreWeaver improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Keep proposals public-safe. Do not include private plans or secrets.
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What user or engineering outcome should this improve?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Harness
        - Agent1
        - Studio
        - Benchmarks
        - Debug/replay
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Describe the smallest useful change.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What checks or behavior would prove this is done?
    validations:
      required: true
