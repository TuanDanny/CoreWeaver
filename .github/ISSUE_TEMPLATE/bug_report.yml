name: Bug report
description: Report a reproducible CoreWeaver defect.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include API keys, private plans, generated debug bundles, or sensitive artifacts.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: List the exact commands, inputs, or Studio flow.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Checks run
      description: Paste command names and pass/fail status only; avoid secrets and large logs.
      placeholder: |
        python -m pytest -q tests
        python scripts/harness_check.py --json
        python scripts/run_benchmarks.py --cases benchmarks/cases --json
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Harness
        - Agent1
        - Studio
        - Benchmarks
        - Debug/replay
        - Documentation
        - Other
    validations:
      required: true
