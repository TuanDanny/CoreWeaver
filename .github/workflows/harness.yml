name: Harness

on:
  push:
  pull_request:

jobs:
  harness:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test
        run: python -m pytest -q tests
      - name: Harness check
        run: python scripts\harness_check.py --json
