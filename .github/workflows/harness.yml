name: Harness

on:
  push:
  pull_request:

jobs:
  harness:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pydantic fastapi httpx python-multipart

      - name: Test
        run: python -m pytest -q tests

      - name: Harness check
        run: python scripts\harness_check.py --json

      - name: Benchmark evidence gate
        run: python scripts\run_benchmarks.py --cases benchmarks\cases --results "$env:RUNNER_TEMP\coreweaver-benchmark-results" --json
